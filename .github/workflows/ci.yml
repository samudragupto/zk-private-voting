name: ZK Private Voting CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-zk-and-contracts:
    name: Test Contracts and ZK Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Circom binary
        run: |
          curl -L -o /usr/local/bin/circom https://github.com/iden3/circom/releases/download/v2.2.1/circom-linux-amd64
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Compile Circom circuit
        run: node scripts/compileCircuit.js

      - name: Check circuit constraints
        run: npx snarkjs r1cs info circuits/build/voting.r1cs

      - name: Compile Solidity contracts
        run: npx hardhat compile

      - name: Run Hardhat unit tests
        run: npx hardhat test

      - name: Execute Groth16 proof generation pipeline
        run: node scripts/generateProof.js

      - name: Verify proof locally with SnarkJS
        run: npx snarkjs groth16 verify circuits/build/verification_key.json scripts/generated/public.json scripts/generated/proof.json

      - name: Run empirical performance benchmark
        run: node scripts/benchmark.js

  build-frontend:
    name: Build Frontend Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build
